name: Branch Quality Pipeline

on:
  pull_request:
    branches:
      - dev
      - test
      - prod

permissions:
  contents: write
  pull-requests: write

jobs:

  # --------------------------------
  # 1️⃣ feature → dev (Prettier)
  # --------------------------------
  prettier-check:
    if: github.base_ref == 'dev' && startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Prettier Auto Fix
        run: |
          npm run format:fix
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-fix Prettier formatting" || echo "No changes"
          git push


  # --------------------------------
  # 2️⃣ dev → test (Lint + Coverage)
  # --------------------------------
  lint-and-test:
    if: github.base_ref == 'test' && github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm test


  # --------------------------------
  # 3️⃣ test → prod (Auto Merge)
  # --------------------------------
  auto-merge-prod:
    if: github.base_ref == 'prod' && github.head_ref == 'test'
    runs-on: ubuntu-latest

    steps:
      - name: Enable Auto Merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash